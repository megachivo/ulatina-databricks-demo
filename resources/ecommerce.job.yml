resources:
  jobs:
    ecommerce_e2e:
      name: "Ulatina - E-commerce End-to-End"
      description: "Genera datos -> pipeline medallion -> IA sobre reseñas + modelo de churn -> gobierno UC."
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: lote
          default: "1"

      tasks:
        - task_key: generar_datos
          notebook_task:
            notebook_path: ../src/notebooks/01_generar_datos.py

        - task_key: pipeline_medallion
          depends_on: [{task_key: generar_datos}]
          pipeline_task:
            pipeline_id: ${resources.pipelines.ecommerce_medallion.id}

        - task_key: ia_resenas
          depends_on: [{task_key: pipeline_medallion}]
          notebook_task:
            notebook_path: ../src/notebooks/03_ia_resenas.sql

        - task_key: ml_churn
          depends_on: [{task_key: pipeline_medallion}]
          notebook_task:
            notebook_path: ../src/notebooks/04_ml_churn.py

        - task_key: gobierno_uc
          depends_on: [{task_key: ia_resenas}, {task_key: ml_churn}]
          notebook_task:
            notebook_path: ../src/notebooks/05_gobierno_uc.sql
